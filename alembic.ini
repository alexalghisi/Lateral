# ---------------------------------------------------------------------------
# Alembic configuration.
#
# ARCHITECTURAL DECISION: `sqlalchemy.url` is deliberately absent.
#
# The stock Alembic template hard-codes the connection URL here, which puts a
# database password in a tracked file and creates a second, divergent source of
# configuration truth. Instead, migrations/env.py resolves the URL from the same
# `Settings` object the application uses, so there is exactly one definition of
# where the database lives and no credential in version control.
# ---------------------------------------------------------------------------

[alembic]
script_location = migrations

# Prefix revision filenames with a UTC timestamp. Without this, `ls versions/`
# returns hashes in arbitrary order and reviewers cannot see the intended
# sequence of a branch at a glance.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

# Resolve paths relative to the repository root rather than the caller's cwd,
# so `alembic` behaves identically from the host and from inside the container.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO so that applied revisions are visible in container startup logs. When a
# deployment misbehaves, the first question is always "which migrations ran?".
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
