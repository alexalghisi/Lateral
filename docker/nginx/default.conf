# ---------------------------------------------------------------------------
# Nginx reverse proxy in front of Uvicorn.
#
# ARCHITECTURAL DECISION -- why a proxy at all, when Uvicorn can serve directly.
#
# Nginx handles the hostile parts of the public internet that an application
# server should not have to: slow-client attacks (Slowloris) absorbed by
# Nginx's buffering, request body size limits enforced before a byte reaches
# Python, TLS termination, and connection handling at a scale Uvicorn workers
# should not be spending time on. It also gives us one place to add rate
# limiting and security headers without touching application code.
# ---------------------------------------------------------------------------

upstream lateral_api {
    # `api` resolves through Docker's embedded DNS to the API service.
    server api:8000;

    # Reuse upstream connections instead of completing a TCP handshake per
    # request. Requires HTTP/1.1 and a cleared Connection header (set below).
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Do not advertise the Nginx version in responses or error pages. Free
    # reconnaissance for anyone scanning for known-vulnerable versions.
    server_tokens off;

    # Reject oversized bodies at the edge. Without a limit, an attacker can
    # make the application server buffer arbitrarily large uploads. A takeaway
    # API exchanges small JSON documents; 1 MB is generous.
    client_max_body_size 1m;

    # Slow-client protection: a client that cannot send its request in these
    # windows is dropped before it occupies a Python worker.
    client_body_timeout 10s;
    client_header_timeout 10s;

    # --- Security headers ----------------------------------------------------
    # `always` so they are emitted on error responses too, which is precisely
    # where they are most often missing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://lateral_api;

        # HTTP/1.1 with an empty Connection header is required for upstream
        # keepalive to actually engage.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Preserve the client's view of the request. Uvicorn runs with
        # --proxy-headers and rewrites its notion of scheme and client IP from
        # these. Without them, every request appears to originate from the
        # proxy's container IP, and generated URLs claim http:// behind TLS.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # NOTE: because Uvicorn trusts forwarded headers, the API port must
        # never be reachable directly from an untrusted network -- a client
        # bypassing the proxy could otherwise spoof its own source address.
        # In Compose the API port is published only for local debugging; in a
        # real deployment it stays on the internal network.

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health probes bypass the access log. They fire every few seconds and
    # would otherwise drown out real traffic in the log volume.
    location /health/ {
        access_log off;
        proxy_pass http://lateral_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
