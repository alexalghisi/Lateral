# ---------------------------------------------------------------------------
# Nginx: serves the React SPA and reverse-proxies the API to Uvicorn.
#
# ARCHITECTURAL DECISION -- one origin for the whole product.
#
# Nginx serves the compiled frontend from disk and forwards the API surface
# (/api, /health, and the docs) to the application server. Because the SPA and
# the API answer on the same host and port, every request the browser makes is
# same-origin: no CORS, no preflight, no credentials-mode footguns. Nginx also
# absorbs the hostile parts of the public internet an app server should not have
# to -- slow-client attacks, oversized bodies, TLS termination, connection
# handling -- and gives us one place for security headers.
# ---------------------------------------------------------------------------

upstream lateral_api {
    # `api` resolves through Docker's embedded DNS to the API service.
    server api:8000;

    # Reuse upstream connections instead of a TCP handshake per request.
    # Requires HTTP/1.1 and a cleared Connection header (set below).
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Do not advertise the Nginx version -- free reconnaissance otherwise.
    server_tokens off;

    # Reject oversized bodies at the edge. A takeaway API exchanges small JSON
    # documents; 1 MB is generous.
    client_max_body_size 1m;

    # Slow-client protection: a client that cannot send its request in these
    # windows is dropped before it occupies a worker.
    client_body_timeout 10s;
    client_header_timeout 10s;

    # --- Security headers ----------------------------------------------------
    # `always` so they are emitted on error responses too, where they are most
    # often missing. Inherited by location blocks that declare no add_header of
    # their own (i.e. everything except the immutable-asset block below).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://lateral_api;

        # HTTP/1.1 + empty Connection header for upstream keepalive to engage.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Preserve the client's view of the request. Uvicorn runs with
        # --proxy-headers and rewrites scheme and client IP from these.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Interactive API documentation and schema, proxied to FastAPI.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://lateral_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health probes bypass the access log -- they fire every few seconds and
    # would otherwise drown out real traffic.
    location /health/ {
        access_log off;
        proxy_pass http://lateral_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # --- Static SPA ----------------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so they can be cached
    # forever; a new deploy ships new names. index.html must never be cached, or
    # clients keep booting an old bundle that points at deleted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html so client-side routing works
    # on a hard refresh or a deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
